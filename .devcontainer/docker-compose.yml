# Sukat Kalusugan — Codespaces staging compose (test data ONLY, never prod data).
# DB credentials come from the environment (.env / Codespaces Secrets).
# Defaults are weak on purpose for an ephemeral box whose DB port is private;
# override DB_PASS via Codespaces Secrets for shared boxes.
services:
  app:
    build: .
    depends_on:
      - db
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sukat_staging}
      DB_USER: ${DB_USER:-sukat}
      DB_PASS: ${DB_PASS:-stagingpass}
      APP_ENV: staging
      FORCE_HTTPS: "0"
      STAGING_PASSWORD: ${STAGING_PASSWORD:-}
      APP_URL: ${APP_URL:-}
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - staging-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-stagingroot}
      MYSQL_DATABASE: ${DB_NAME:-sukat_staging}
      MYSQL_USER: ${DB_USER:-sukat}
      MYSQL_PASSWORD: ${DB_PASS:-stagingpass}
    # DB port stays PRIVATE to the Codespace (never forwarded publicly).

volumes:
  staging-db:
